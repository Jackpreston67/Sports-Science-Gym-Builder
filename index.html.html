<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Gym Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px 12px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1, h2, h3, .heading-font {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 2px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Top Navigation Tabs */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            color: #fff;
        }

        /* Mode Selector */
        .goal-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .goal-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .goal-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Counter Banner */
        .exercise-count-banner {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-count-banner.valid {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Exercise Selection List */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 16px;
        }

        .exercise-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
        }

        .exercise-item label {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            flex-grow: 1;
        }

        .exercise-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Custom Exercise Inputs */
        .add-custom-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="text"], input[type="number"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }

        /* Modern Sharp Buttons */
        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
        }

        /* Recommended Routines Card Styling */
        .preset-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .preset-card h3 {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .preset-card ul {
            list-style: none;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .preset-card li {
            margin-bottom: 2px;
        }

        /* Tracker View */
        .track-exercise {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .track-exercise:last-child {
            border-bottom: none;
        }

        .track-exercise h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .set-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .set-label {
            width: 45px;
            font-weight: bold;
            color: var(--accent);
        }

        .set-info {
            width: 90px;
            color: var(--text-muted);
        }

        .set-input {
            width: 80px !important;
            padding: 8px !important;
            text-align: center;
        }

        .set-check {
            width: 22px;
            height: 22px;
            accent-color: var(--success);
            cursor: pointer;
        }

        /* Hidden States */
        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print, button { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ccc; background: white; color: black; }
            h3, h2, .set-label { color: black !important; }
            input { border: 1px solid #000 !important; color: black !important; }
        }
    </style>
</head>
<body>

    <header class="no-print">
        <h1 class="heading-font">⚡ School Gym Hub</h1>
        <p class="subtitle">Custom routines built for school equipment</p>
    </header>

    <div class="tab-nav no-print">
        <button class="tab-btn heading-font active" id="tab-custom-btn" onclick="switchTab('custom')">Create Program</button>
        <button class="tab-btn heading-font" id="tab-presets-btn" onclick="switchTab('presets')">Recommended (5)</button>
    </div>

    <div id="view-custom" class="page-view active">
        <div class="card">
            <h2>1. Select Focus</h2>
            <div class="goal-selector">
                <button class="goal-btn heading-font active" onclick="setGoal('strength')">Strength<br><small>(3x5)</small></button>
                <button class="goal-btn heading-font" onclick="setGoal('hypertrophy')">Hypertrophy<br><small>(3x10)</small></button>
                <button class="goal-btn heading-font" onclick="setGoal('power')">Power<br><small>(4x3)</small></button>
            </div>

            <h2>2. Select Exercises</h2>
            
            <div class="exercise-count-banner" id="count-banner">
                <span>Selected Exercises:</span>
                <span id="selected-count-txt">0 / 5</span>
            </div>

            <div class="exercise-list" id="exercise-options">
                </div>

            <div class="add-custom-box">
                <input type="text" id="custom-ex-input" placeholder="Add custom exercise..." style="flex-grow: 1;">
                <button class="btn btn-secondary" onclick="addCustomExercise()" style="width: auto; padding: 0 16px;">+ Add</button>
            </div>

            <button class="btn heading-font" id="build-btn" disabled onclick="buildWorkout()">Build My Program 🚀</button>
        </div>
    </div>

    <div id="view-presets" class="page-view">
        <div class="card">
            <h2>Recommended Workouts</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Choose a pre-made 5-exercise program optimized for the school gym.</p>
            
            <div id="presets-container">
                </div>
        </div>
    </div>

    <div id="view-tracker" class="page-view">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="border: none; margin: 0;">Active Program</h2>
                <span id="program-tag" style="background: var(--accent); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold;" class="heading-font"></span>
            </div>

            <div id="tracker-container">
                </div>

            <div class="no-print" style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
                <button class="btn btn-success heading-font" onclick="saveProgress()">Save Progress 💾</button>
                <button class="btn btn-secondary heading-font" onclick="window.print()">Save as PDF / Print 📄</button>
                <button class="btn btn-secondary heading-font" onclick="backToBuilder()">Edit Exercises ✏️</button>
            </div>
        </div>
    </div>

    <script>
        // Default gym exercise list
        let exercises = [
            "Dumbbell Goblet Squat",
            "Dumbbell Bench / Floor Press",
            "Dumbbell Romanian Deadlift",
            "Dumbbell Single-Arm Row",
            "Push-Ups",
            "Pull-Ups / Chin-Ups",
            "Dumbbell Overhead Press",
            "Bodyweight Walking Lunges",
            "Plank",
            "Dumbbell Bicep Curls",
            "Bench Tricep Dips",
            "Resistance Band Face Pulls"
        ];

        // 5 Pre-made Recommended Sets
        const presetWorkouts = [
            {
                name: "Full Body A",
                exercises: ["Dumbbell Goblet Squat", "Dumbbell Bench / Floor Press", "Dumbbell Single-Arm Row", "Dumbbell Overhead Press", "Plank"]
            },
            {
                name: "Full Body B",
                exercises: ["Dumbbell Romanian Deadlift", "Push-Ups", "Pull-Ups / Chin-Ups", "Bodyweight Walking Lunges", "Resistance Band Face Pulls"]
            },
            {
                name: "Upper Body Focus",
                exercises: ["Dumbbell Bench / Floor Press", "Dumbbell Single-Arm Row", "Dumbbell Overhead Press", "Dumbbell Bicep Curls", "Bench Tricep Dips"]
            },
            {
                name: "Lower Body & Core",
                exercises: ["Dumbbell Goblet Squat", "Dumbbell Romanian Deadlift", "Bodyweight Walking Lunges", "Plank", "Resistance Band Face Pulls"]
            },
            {
                name: "Bodyweight & Dumbbell Hybrid",
                exercises: ["Push-Ups", "Pull-Ups / Chin-Ups", "Dumbbell Goblet Squat", "Bench Tricep Dips", "Plank"]
            }
        ];

        let selectedGoal = 'strength';

        const presetsConfig = {
            strength: { sets: 3, reps: "5 reps", tag: "Strength (3x5)" },
            hypertrophy: { sets: 3, reps: "10-12 reps", tag: "Hypertrophy (3x10-12)" },
            power: { sets: 4, reps: "3 reps", tag: "Power (4x3)" }
        };

        // Initialize Builder
        function renderExercises() {
            const container = document.getElementById('exercise-options');
            container.innerHTML = '';
            exercises.forEach((ex, index) => {
                container.innerHTML += `
                    <div class="exercise-item">
                        <label for="ex-${index}">${ex}</label>
                        <input type="checkbox" id="ex-${index}" value="${ex}" onchange="updateExerciseCount()">
                    </div>
                `;
            });
            updateExerciseCount();
        }

        // Render Preset Workouts
        function renderPresets() {
            const container = document.getElementById('presets-container');
            container.innerHTML = '';
            presetWorkouts.forEach((preset, index) => {
                let exListHtml = preset.exercises.map(ex => `<li>• ${ex}</li>`).join('');
                container.innerHTML += `
                    <div class="preset-card">
                        <h3 class="heading-font">${preset.name}</h3>
                        <ul>${exListHtml}</ul>
                        <button class="btn btn-secondary heading-font" style="padding: 8px; font-size: 0.85rem;" onclick="loadPreset(${index})">Use Routine</button>
                    </div>
                `;
            });
        }

        function updateExerciseCount() {
            const selected = document.querySelectorAll('#exercise-options input[type="checkbox"]:checked');
            const count = selected.length;
            const countTxt = document.getElementById('selected-count-txt');
            const banner = document.getElementById('count-banner');
            const buildBtn = document.getElementById('build-btn');

            countTxt.innerText = `${count} / 5`;

            if (count === 5) {
                banner.classList.add('valid');
                buildBtn.disabled = false;
            } else {
                banner.classList.remove('valid');
                buildBtn.disabled = true;
            }
        }

        function addCustomExercise() {
            const input = document.getElementById('custom-ex-input');
            const val = input.value.trim();
            if (val === '') return;

            exercises.push(val);
            input.value = '';
            renderExercises();
        }

        function setGoal(goal) {
            selectedGoal = goal;
            document.querySelectorAll('.goal-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.goal-btn').classList.add('active');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page-view').forEach(view => view.classList.remove('active'));

            if (tab === 'custom') {
                document.getElementById('tab-custom-btn').classList.add('active');
                document.getElementById('view-custom').classList.add('active');
            } else if (tab === 'presets') {
                document.getElementById('tab-presets-btn').classList.add('active');
                document.getElementById('view-presets').classList.add('active');
            }
        }

        function buildWorkoutWithList(selectedExercises) {
            const container = document.getElementById('tracker-container');
            container.innerHTML = '';
            
            const config = presetsConfig[selectedGoal];
            document.getElementById('program-tag').innerText = config.tag;

            selectedExercises.forEach((exName) => {
                let setsHtml = '';
                for (let i = 1; i <= config.sets; i++) {
                    setsHtml += `
                        <div class="set-row">
                            <span class="set-label">SET ${i}</span>
                            <span class="set-info">${config.reps}</span>
                            <input type="number" class="set-input" placeholder="kg" min="0">
                            <input type="checkbox" class="set-check">
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="track-exercise">
                        <h3 class="heading-font">${exName}</h3>
                        ${setsHtml}
                    </div>
                `;
            });

            document.querySelectorAll('.page-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-tracker').classList.add('active');
        }

        function buildWorkout() {
            const selected = [];
            document.querySelectorAll('#exercise-options input[type="checkbox"]:checked').forEach(cb => {
                selected.push(cb.value);
            });

            if (selected.length !== 5) {
                alert("Please select exactly 5 exercises.");
                return;
            }

            buildWorkoutWithList(selected);
        }

        function loadPreset(index) {
            const preset = presetWorkouts[index];
            buildWorkoutWithList(preset.exercises);
        }

        function backToBuilder() {
            document.querySelectorAll('.page-view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-custom').classList.add('active');
            document.getElementById('tab-custom-btn').classList.add('active');
        }

        function saveProgress() {
            alert("Progress saved locally!");
        }

        // Run on load
        renderExercises();
        renderPresets();
    </script>
</body>
</html>
